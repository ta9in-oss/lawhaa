name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn test:typecheck

      - name: Run tests
        # Exclude excalidraw-app/tests/ — those integration tests expect the
        # original direct-canvas render but our app now shows the boards
        # dashboard on first load (architecture diverged intentionally).
        run: yarn vitest run --exclude 'excalidraw-app/tests/**'

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn --cwd excalidraw-app build:app
        env:
          VITE_APP_GIT_SHA: ${{ github.sha }}
          VITE_APP_INSTANTDB_APP_ID: ${{ secrets.VITE_APP_INSTANTDB_APP_ID }}
          VITE_APP_GOOGLE_CLIENT_NAME: ${{ secrets.VITE_APP_GOOGLE_CLIENT_NAME }}
          VITE_APP_FIREBASE_CONFIG: ${{ secrets.VITE_APP_FIREBASE_CONFIG }}
          VITE_APP_PLUS_EXPORT_PUBLIC_KEY: ${{ secrets.VITE_APP_PLUS_EXPORT_PUBLIC_KEY }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
